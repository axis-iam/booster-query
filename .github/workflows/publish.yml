name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release tag matches project version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          PROJECT_VERSION=$(bash ./gradlew :properties --quiet | awk '$1 == "version:" { print $2 }')
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match project version $PROJECT_VERSION"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Verify publishing secrets
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          test -n "$CENTRAL_PORTAL_USERNAME"
          test -n "$CENTRAL_PORTAL_PASSWORD"
          test -n "$GPG_SIGNING_KEY"
          test -n "$GPG_SIGNING_PASSWORD"

      - name: Verify build and database tests
        run: bash ./gradlew build verifyIntegrationTests jacocoTestCoverageVerification --no-daemon

      - name: Update vulnerability database and scan dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 10m bash ./gradlew dependencyCheckUpdate --no-daemon \
              "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m"; then
              break
            fi
            echo "NVD update failed on attempt ${attempt}; discarding the incomplete database."
            bash ./gradlew dependencyCheckPurge --no-daemon
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
          done
          bash ./gradlew dependencyCheckAnalyze --no-daemon --rerun-tasks \
            "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload artifacts to Central Portal staging API
        run: bash ./gradlew publishMavenPublicationToCentralPortalRepository
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Validate and publish Central Portal deployment
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          AUTH_TOKEN=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 -w0)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.chaosguide?publishing_type=automatic"
