name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: bash ./gradlew build verifyIntegrationTests jacocoTestCoverageVerification

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: build/reports/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Scan dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 10m bash ./gradlew dependencyCheckUpdate --no-daemon \
              "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m"; then
              break
            fi
            echo "NVD update failed on attempt ${attempt}; discarding the incomplete database."
            bash ./gradlew dependencyCheckPurge --no-daemon
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
          done
          bash ./gradlew dependencyCheckAnalyze --no-daemon --rerun-tasks \
            "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: build/reports/dependency-check/
